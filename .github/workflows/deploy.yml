name: Deploy to AWS ECS

on:
  push:
    branches:
      - main

env:
  AWS_REGION: us-east-1
  ECS_CLUSTER: webapp-cluster
  ECS_SERVICE: webapp-service
  IMAGE_REPO_NAME: webapp
  IMAGE_TAG: latest
  CONTAINER_NAME: webapp

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: 📦 Cloner le dépôt
      uses: actions/checkout@v3

    - name: 🔐 Connexion à DockerHub
      run: echo "${{ secrets.DOCKERHUB_PASSWORD }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

    - name: 🛠️ Construire l’image Docker
      run: |
        docker build -t ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO_NAME }}:${{ env.IMAGE_TAG }} .

    - name: 📤 Pousser l’image Docker
      run: |
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO_NAME }}:${{ env.IMAGE_TAG }}

    - name: 📄 Mettre à jour le taskdef.json avec la nouvelle image
      run: |
        sed -i "s|image\": \".*\"|image\": \"${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_REPO_NAME }}:${{ env.IMAGE_TAG }}\"|g" taskdef.json

    - name: ☁️ Configurer les identifiants AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: 🚀 Déployer sur ECS
      uses: aws-actions/amazon-ecs-deploy-task-definition@v1
      with:
        task-definition: taskdef.json
        service: ${{ env.ECS_SERVICE }}
        cluster: ${{ env.ECS_CLUSTER }}
        wait-for-service-stability: true

