name: Deploy to Amazon ECS

on:
  push:
    branches:
      - main  # ou master si ton branche principale s'appelle master

env:
  AWS_REGION: us-east-1
  IMAGE_REPO_NAME: mehdispace
  IMAGE_TAG: latest

jobs:
  build-and-deploy:
    name: Build and Deploy to ECS
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v3

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Log in to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build Docker image
        run: |
          docker build -t $IMAGE_REPO_NAME:$IMAGE_TAG .
          docker tag $IMAGE_REPO_NAME:$IMAGE_TAG ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

      - name: Push image to Amazon ECR
        run: |
          docker push ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG

      - name: Create imagedefinitions.json
        run: |
          echo '[{"name":"webapp","imageUri":"'"${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG"'"}]' > imagedefinitions.json

      - name: Deploy to ECS using CodeDeploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: taskdef.json
          service: webapp-service             # 👉 remplace par le nom de ton service ECS
          cluster: webapp-cluster             # 👉 remplace par le nom de ton cluster ECS
          image: ${{ secrets.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/$IMAGE_REPO_NAME:$IMAGE_TAG
# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the workflow will run
on:
